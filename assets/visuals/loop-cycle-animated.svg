<svg xmlns="http://www.w3.org/2000/svg" aria-label="Anatomy of a loop — animated flow" role="img" viewBox="0 0 960 320"><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0%" stop-color="#0d1420"/><stop offset="100%" stop-color="#070b12"/></linearGradient><linearGradient id="accent" x1="0" x2="1" y1="0" y2="0"><stop offset="0%" stop-color="#3ee8c5"/><stop offset="100%" stop-color="#5b9dff"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="b" stdDeviation="3"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="arrow" markerHeight="6" markerWidth="6" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#3ee8c5" d="M 0 0 L 10 5 L 0 10 z"/></marker><style>@keyframes pulse{0%{opacity:.55}50%{opacity:1}}.title{font:700 22px system-ui,-apple-system,sans-serif;fill:#e8edf5;letter-spacing:-.02em}.subtitle{font:500 13px system-ui,-apple-system,sans-serif;fill:#8b9cb3}.node-label{font:600 11px system-ui,-apple-system,sans-serif;fill:#e8edf5}.node-sub{font:500 9px system-ui,-apple-system,sans-serif;fill:#8b9cb3}.flow{fill:none;stroke:url(#accent);stroke-width:2.5;stroke-linecap:round;stroke-dasharray:10 8;marker-end:url(#arrow);animation:dash 2.4s linear infinite}.pulse{animation:pulse 2.4s ease-in-out infinite}</style></defs><rect width="960" height="320" fill="url(#bg)" rx="18"/><rect width="958" height="318" x="1" y="1" fill="none" stroke="rgba(62,232,197,0.18)" stroke-width="1" rx="17"/><text x="32" y="42" class="title">Anatomy of a Loop</text><text x="32" y="62" class="subtitle">Design once — the system prompts, verifies, and iterates</text><path d="M 108 170 C 148 170, 168 130, 208 130 C 248 130, 268 170, 308 170 C 348 170, 368 210, 408 210 C 448 210, 468 170, 508 170 C 548 170, 568 130, 608 130 C 648 130, 668 170, 708 170 C 748 170, 768 210, 808 210 C 848 210, 868 170, 908 170" class="flow"/><g filter="url(#glow)"><g style="anima